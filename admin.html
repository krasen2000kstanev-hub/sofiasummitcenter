<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sofia Summit — Админ</title>
  <style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;color:#102653}button,input{font:inherit;padding:9px 12px;margin:4px;border:1px solid #b8ccef;border-radius:5px}button{background:#2452b8;color:#fff;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:24px;font-size:14px}th,td{padding:9px;border-bottom:1px solid #d6e0f2;text-align:left}#error{color:#a12b2b;margin-top:12px}</style>
</head>
<body>
  <h1>Регистрации</h1>
  <p>Административен преглед за NAIL BUSINESS RE:START.</p>
  <label>API адрес <input id="api" value="https://api.sofiasummit.bg" size="32"></label>
  <label>Потребител <input id="user" autocomplete="username"></label>
  <label>Парола <input id="pass" type="password" autocomplete="current-password"></label>
  <button id="load">Зареди</button>
  <a id="export" target="_blank">Изтегли CSV</a>
  <form id="clone"><h2>Ново събитие от шаблон</h2><input name="sourceSlug" value="nail-business-restart" placeholder="Шаблон" required><input name="newSlug" placeholder="нов-slug" required><input name="name" placeholder="Име на събитието" required><input name="startsAt" placeholder="2026-12-01T09:00:00+02:00" required><button>Създай чернова</button></form>
  <p id="error"></p>
  <table><thead><tr><th>Поръчка</th><th>Дата</th><th>Купувач</th><th>Имейл</th><th>Билет</th><th>Брой</th><th>Сума</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    $('load').onclick = async () => {
      const api = $('api').value.replace(/\/$/, '');
      const auth = 'Basic ' + btoa($('user').value + ':' + $('pass').value);
      $('export').href = api + '/api/admin/export.csv';
      $('export').onclick = (e) => { e.preventDefault(); fetch(e.currentTarget.href, {headers:{Authorization:auth}}).then(r=>r.blob()).then(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='registrations.csv';a.click();}); };
      try {
        const response = await fetch(api + '/api/admin/orders', {headers:{Authorization:auth}});
        if (!response.ok) throw new Error('Невалидни администраторски данни.');
        const orders = await response.json();
        $('error').textContent = '';
        $('rows').innerHTML = orders.map(o => `<tr><td>${esc(o.id)}</td><td>${esc(o.created_at)}</td><td>${esc(o.buyer_name)}</td><td>${esc(o.buyer_email)}</td><td>${esc(o.ticket_name)}</td><td>${esc(o.attendee_count)}</td><td>${(Number(o.amount_cents)/100).toFixed(2)} ${esc(o.currency)}</td><td>${esc(o.status)}</td><td><select data-status="${esc(o.id)}"><option>paid</option><option>cancelled</option><option>refunded</option></select><button data-save="${esc(o.id)}">Запази</button><button data-resend="${esc(o.id)}">Билет</button></td></tr>`).join('');
        document.querySelectorAll('[data-save]').forEach(button => button.onclick = async () => { const status = document.querySelector(`[data-status="${CSS.escape(button.dataset.save)}"]`).value; await fetch(api + '/api/admin/orders/' + encodeURIComponent(button.dataset.save) + '/status', {method:'POST',headers:{Authorization:auth,'content-type':'application/json'},body:JSON.stringify({status})}); $('load').click(); });
        document.querySelectorAll('[data-resend]').forEach(button => button.onclick = async () => { await fetch(api + '/api/admin/orders/' + encodeURIComponent(button.dataset.resend) + '/resend-ticket', {method:'POST',headers:{Authorization:auth}}); alert('Заявката за повторно изпращане е изпратена.'); });
      } catch (e) { $('error').textContent = e.message; }
    };
    $('clone').onsubmit = async (event) => { event.preventDefault(); const api = $('api').value.replace(/\/$/, ''); const auth = 'Basic ' + btoa($('user').value + ':' + $('pass').value); const body = Object.fromEntries(new FormData(event.currentTarget)); const response = await fetch(api + '/api/admin/events/clone', {method:'POST',headers:{Authorization:auth,'content-type':'application/json'},body:JSON.stringify(body)}); $('error').textContent = response.ok ? 'Черновата е създадена.' : 'Неуспешно създаване на събитие.'; };
  </script>
</body>
</html>
