name: Add DSK logo

on:
  push:
    paths:
      - .github/workflows/add-dsk-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Add DSK partner logo
        env:
          DSK_LOGO_URL: "https://dskbank.bg/images/default-source/%D0%BC%D0%B5%D0%B4%D0%B8%D0%B5%D0%BD-%D1%86%D0%B5%D0%BD%D1%82%D1%8A%D1%80-%D0%B1%D0%B0%D0%BD%D0%BA%D0%B0-%D0%B4%D1%81%D0%BA/%D0%BB%D0%BE%D0%B3%D0%BE-%D0%BD%D0%B0-%D0%B1%D0%B0%D0%BD%D0%BA%D0%B0-%D0%B4%D1%81%D0%BA.png"
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = '<div class="partner-card"><img src="assets/partners/digitalpro.png" alt="Digital Pro"></div>'
          logo = f'<div class="partner-card"><img src="{os.environ["DSK_LOGO_URL"]}" alt="Банка ДСК" title="Лого: dskbank.bg"></div>'

          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one Digital Pro partner card")
          if "alt=\"Банка ДСК\"" in text:
              raise SystemExit("DSK logo already exists")

          path.write_text(text.replace(marker, marker + "\n        " + logo, 1), encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Bank DSK partner logo"
          git push origin main
