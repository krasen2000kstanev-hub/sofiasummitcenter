name: Fix promo apply button
on:
  push:
    paths:
      - .github/workflows/fix-promo-button.yml
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync branch
        run: git pull --rebase origin main
      - name: Fix promo button reset
        shell: python
        run: |
          from pathlib import Path
          path = Path("events/nail-business-restart/index.html")
          text = path.read_text(encoding="utf-8")
          old_success = """        form.dataset.appliedPromo = code;
        setNote('Промокодът е приложен. Отстъпка: ' + quote.discountPercent + '%.', false);
        if (code) trackEvent('apply_promo_code', { code: code });
        return true;"""
          new_success = """        form.dataset.appliedPromo = code;
        setNote('Промокодът е приложен. Отстъпка: ' + quote.discountPercent + '%.', false);
        if (code) trackEvent('apply_promo_code', { code: code });
        promoBtn.disabled = false;
        return true;"""
          old_error = """        if (showErrors) setNote(error.message, true);
        return false;"""
          new_error = """        if (showErrors) setNote(error.message, true);
        promoBtn.disabled = false;
        return false;"""
          if old_success not in text or old_error not in text:
              raise SystemExit("promo code target not found")
          text = text.replace(old_success, new_success, 1).replace(old_error, new_error, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit and push
        run: |
          git config user.name "codex-site-bot"
          git config user.email "codex-site-bot@users.noreply.github.com"
          git add events/nail-business-restart/index.html
          git commit -m "Reset promo apply button after quote"
          git push origin HEAD:main
