name: Add event start time to date

on:
  push:
    paths:
      - '.github/workflows/add-event-start-time.yml'

permissions:
  contents: write

jobs:
  update-date-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add start time to visible date
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("events/nail-business-restart/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("15 ноември 2026", "15 ноември 2026 от 09:00 ч.")
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- events/nail-business-restart/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/nail-business-restart/index.html
          git commit -m "Show event start time next to date"
          git push
