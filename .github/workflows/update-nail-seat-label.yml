name: Update nail seats label
on:
  push:
    paths:
      - .github/workflows/update-nail-seat-label.yml
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync branch
        run: git pull --rebase origin main
      - name: Fix promo apply button
        shell: python
        run: |
          from pathlib import Path
          path = Path("events/nail-business-restart/index.html")
          text = path.read_text(encoding="utf-8")
          old_success = "        form.dataset.appliedPromo = code;\n        setNote('Промокодът е приложен. Отстъпка: ' + quote.discountPercent + '%.', false);\n        if (code) trackEvent('apply_promo_code', { code: code });\n        return true;"
          new_success = "        form.dataset.appliedPromo = code;\n        setNote('Промокодът е приложен. Отстъпка: ' + quote.discountPercent + '%.', false);\n        if (code) trackEvent('apply_promo_code', { code: code });\n        promoBtn.disabled = false;\n        return true;"
          old_error = "        if (showErrors) setNote(error.message, true);\n        return false;"
          new_error = "        if (showErrors) setNote(error.message, true);\n        promoBtn.disabled = false;\n        return false;"
          if old_success not in text or old_error not in text:
              raise SystemExit("promo code target not found")
          text = text.replace(old_success, new_success, 1).replace(old_error, new_error, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit and push
        run: |
          git config user.name "codex-site-bot"
          git config user.email "codex-site-bot@users.noreply.github.com"
          git add events/nail-business-restart/index.html
          git commit -m "Show remaining seats only on nail event page"
          git push origin HEAD:main
