name: Update nail seats label
on:
  push:
    paths:
      - .github/workflows/update-nail-seat-label.yml
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync branch
        run: git pull --rebase origin main
      - name: Update label
        shell: python
        run: |
          from pathlib import Path
          path = Path("events/nail-business-restart/index.html")
          text = path.read_text(encoding="utf-8")
          old = "remaining === 0 ? 'Свободните места са изчерпани.' : '20 записани участници. Остават 80 свободни места от 100.';"
          new = "remaining === 0 ? 'Свободните места са изчерпани.' : 'Остават ' + remaining + ' свободни места от ' + capacity + '.';"
          if old not in text:
              raise SystemExit("target text not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit and push
        run: |
          git config user.name "codex-site-bot"
          git config user.email "codex-site-bot@users.noreply.github.com"
          git add events/nail-business-restart/index.html
          git commit -m "Show remaining seats only on nail event page"
          git push origin HEAD:main
